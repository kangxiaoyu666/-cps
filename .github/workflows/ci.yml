name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: mvn -B -f backend/pom.xml test package
      - run: mvn -B -f backend/pom.xml checkstyle:check
      - run: mvn -B -f backend/pom.xml org.owasp:dependency-check-maven:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "22", cache: npm, cache-dependency-path: admin-web/package-lock.json}
      - run: npm ci
        working-directory: admin-web
      - run: npm run typecheck && npm run lint && npm run build
        working-directory: admin-web
      - run: npm audit --audit-level=high
        working-directory: admin-web
  miniprogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "22", cache: npm, cache-dependency-path: miniprogram/package-lock.json}
      - run: npm ci && npm run typecheck
        working-directory: miniprogram
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject legacy server and prohibited providers
        run: |
          if grep -R -E --exclude-dir=node_modules --exclude-dir=target "mmpaymkttransfers|dingdanxia|zhetaoke|wawafun|asterye_waimaixia" backend admin-web/src miniprogram; then
            echo "Legacy provider or server reference detected"
            exit 1
          fi
